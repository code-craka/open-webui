<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="/static/favicon.png" />
		<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
		<link rel="shortcut icon" href="/static/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="My Custom WebUI" />

		<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
		<link rel="stylesheet" href="/themes/custom-theme.css" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#1E293B" />
		<meta name="robots" content="noindex,nofollow" />
		<meta name="description" content="My Custom WebUI" />
		<link
			rel="search"
			type="application/opensearchdescription+xml"
			title="My Custom WebUI"
			href="/opensearch.xml"
		/>
		<script src="/static/loader.js" defer></script>

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				// Set default theme to 'custom-system' if nothing is set
				if (!localStorage?.theme) {
					localStorage.theme = 'custom-system'; // New default
				}

				// Apply the theme
				let currentTheme = localStorage.theme;
				let isDark = prefersDarkTheme;

				if (currentTheme === 'custom-system') {
					// Use system preference
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#1E293B' : '#DBEAFE');
				} else if (currentTheme === 'custom-light') {
					isDark = false;
					document.documentElement.classList.add('light');
					document.documentElement.classList.remove('dark');
					metaThemeColorTag.setAttribute('content', '#DBEAFE');
				} else if (currentTheme === 'custom-dark') {
					isDark = true;
					document.documentElement.classList.add('dark');
					document.documentElement.classList.remove('light');
					metaThemeColorTag.setAttribute('content', '#1E293B');
				} else {
					// Fallback to custom-system if an old/unknown theme is stored
					localStorage.theme = 'custom-system';
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#1E293B' : '#DBEAFE');
				}

				// Listener for system theme changes
				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'custom-system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#1E293B');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#DBEAFE');
						}
					}
				});

				// Splash screen image update logic (keep as is, but ensure it respects the new dark/light mode)
				// The existing splash screen logic should work fine as it checks for the 'dark' class.
				function setSplashImage() {
					const logo = document.getElementById('logo');
					// Check if logo element exists before proceeding
					if (!logo) return;
					const isDarkMode = document.documentElement.classList.contains('dark');

					if (isDarkMode) {
						const darkImage = new Image();
						darkImage.src = '/static/splash-dark.png';

						darkImage.onload = () => {
							logo.src = '/static/splash-dark.png';
							logo.style.filter = '';
						};

						darkImage.onerror = () => {
							// If splash-dark.png is missing (e.g. user hasn't replaced placeholder)
							// and splash.png is also a placeholder, this might not look great.
							// For now, keep existing logic.
							logo.style.filter = 'invert(1)';
						};
					} else {
						// Ensure light mode splash is set and no filter applied
						logo.src = '/static/splash.png';
						logo.style.filter = '';
					}
				}

				// Check if DOM is already loaded, otherwise wait for window.onload
				if (document.readyState === 'complete') {
					setSplashImage();
				} else {
					window.onload = setSplashImage;
				}

			})();
		</script>

		<title>My Custom WebUI</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<div
			id="splash-screen"
			style="position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%"
		>
			<style type="text/css" nonce="">
				html {
					overflow-y: scroll !important;
				}
			</style>

			<img
				id="logo"
				style="
					position: absolute;
					width: auto;
					height: 6rem;
					top: 44%;
					left: 50%;
					transform: translateX(-50%);
				"
				src="/static/splash.png"
			/>

			<div
				style="
					position: absolute;
					top: 33%;
					left: 50%;

					width: 24rem;
					transform: translateX(-50%);

					display: flex;
					flex-direction: column;
					align-items: center;
				"
			>
				<img
					id="logo-her"
					style="width: auto; height: 13rem"
					src="/static/splash.png"
					class="animate-pulse-fast"
				/>

				<div style="position: relative; width: 24rem; margin-top: 0.5rem">
					<div
						id="progress-background"
						style="
							position: absolute;
							width: 100%;
							height: 0.75rem;

							border-radius: 9999px;
							background-color: #fafafa9a;
						"
					></div>

					<div
						id="progress-bar"
						style="
							position: absolute;
							width: 0%;
							height: 0.75rem;
							border-radius: 9999px;
							background-color: #fff;
						"
						class="bg-white"
					></div>
				</div>
			</div>

			<!-- <span style="position: absolute; bottom: 32px; left: 50%; margin: -36px 0 0 -36px">
				Footer content
			</span> -->
		</div>
	</body>
</html>

<style type="text/css" nonce="">
	html {
		overflow-y: hidden !important;
	}

	#splash-screen {
		background: #fff;
	}

	html.dark #splash-screen {
		background: #000;
	}

	html.her #splash-screen {
		background: #983724;
	}

	#logo-her {
		display: none;
	}

	#progress-background {
		display: none;
	}

	#progress-bar {
		display: none;
	}

	html.her #logo {
		display: none;
	}

	html.her #logo-her {
		display: block;
		filter: invert(1);
	}

	html.her #progress-background {
		display: block;
	}

	html.her #progress-bar {
		display: block;
	}

	@media (max-width: 24rem) {
		html.her #progress-background {
			display: none;
		}

		html.her #progress-bar {
			display: none;
		}
	}

	@keyframes pulse {
		50% {
			opacity: 0.65;
		}
	}

	.animate-pulse-fast {
		animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
	}
</style>
